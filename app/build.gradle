plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvpy.app'
    compileSdk 35

    // Generar release.keystore automáticamente si no existe
    def keystoreFile = file("release.keystore")
    if (!keystoreFile.exists()) {
        def keytoolPath = "${System.getProperty('java.home')}/bin/keytool"
        if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
            keytoolPath += ".exe"
        }
        try {
            exec {
                commandLine keytoolPath, 
                    "-genkeypair", 
                    "-v", 
                    "-keystore", keystoreFile.absolutePath, 
                    "-alias", "tvparaguay", 
                    "-keyalg", "RSA", 
                    "-keysize", "2048", 
                    "-validity", "10000", 
                    "-storepass", "tvparaguay123", 
                    "-keypass", "tvparaguay123", 
                    "-dname", "CN=TVParaguay, OU=Mobile, O=TVParaguay, L=Asuncion, S=Asuncion, C=PY"
            }
        } catch (Exception e) {
            println("No se pudo generar release.keystore: " + e.getMessage())
        }
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword "tvparaguay123"
            keyAlias "tvparaguay"
            keyPassword "tvparaguay123"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    defaultConfig {
        applicationId "com.tvpy.tvapp"
        minSdk 26
        targetSdk 35
        versionCode 38
        versionName "1.40"
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions "distribution"
    productFlavors {
        playstore {
            dimension "distribution"
            buildConfigField "boolean", "IS_PLAY_STORE", "true"
        }
        website {
            dimension "distribution"
            buildConfigField "boolean", "IS_PLAY_STORE", "false"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Media3 / ExoPlayer — reproductor nativo para streams HLS/MPEG-TS/RTSP
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.3.1'
}
