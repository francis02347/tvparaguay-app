<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TVV Remote - Control Remoto</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="remote.css?v=20261028.1915">

    <!-- PeerJS para enlace directo WebRTC P2P con latencia cero -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
    <div class="remote-app">
        <!-- HEADER DE ESTADO Y CONEXIÓN -->
        <header class="remote-header">
            <div class="brand">
                <span class="brand-logo">📺</span>
                <div class="brand-info">
                    <h1 class="brand-title">TVV REMOTE</h1>
                    <span class="status-indicator disconnected" id="status-badge">
                        <span class="dot"></span>
                        <span id="status-text">Sin conectar</span>
                    </span>
                </div>
            </div>

            <button class="header-btn" id="btn-pairing" title="Vincular pantalla">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M4 4h6v6H4zm2 2v2h2V6zm8-2h6v6h-6zm2 2v2h2V6zM4 14h6v6H4zm2 2v2h2v-2zm10 0h2v2h-2zm-2-2h2v2h-2zm4 0h2v2h-2zm-2 4h2v2h-2zm4 0h2v2h-2z"/>
                </svg>
                <span id="room-code-tag">PIN</span>
            </button>
        </header>

        <!-- MODAL DE EMPAREJAMIENTO MANUAL -->
        <div class="pairing-modal hidden" id="pairing-modal">
            <div class="modal-card">
                <h3>Vincular con tu Pantalla</h3>
                <p>Ingresa el código PIN de 4 dígitos que aparece en tu TV:</p>
                <div class="pin-inputs">
                    <input type="text" maxlength="1" class="pin-digit" id="pin-1" inputmode="numeric" autofocus>
                    <input type="text" maxlength="1" class="pin-digit" id="pin-2" inputmode="numeric">
                    <input type="text" maxlength="1" class="pin-digit" id="pin-3" inputmode="numeric">
                    <input type="text" maxlength="1" class="pin-digit" id="pin-4" inputmode="numeric">
                </div>
                <div class="modal-actions">
                    <button class="btn-secondary" id="btn-cancel-pairing">Cerrar</button>
                    <button class="btn-primary" id="btn-connect-pin">Conectar</button>
                </div>
            </div>
        </div>

        <!-- TABS DE NAVEGACIÓN -->
        <nav class="remote-tabs">
            <button class="tab-btn active" data-tab="pad-view">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 14.5v-2h2a1 1 0 0 0 0-2h-2v-2a1 1 0 0 0-2 0v2H9a1 1 0 0 0 0 2h2v2a1 1 0 0 0 2 0z"/></svg>
                <span>Mando</span>
            </button>
            <button class="tab-btn" data-tab="channels-view">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
                <span>Canales</span>
            </button>
            <button class="tab-btn" data-tab="numpad-view">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M4 4h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4zM4 10h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4zM4 16h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4z"/></svg>
                <span>Números</span>
            </button>
        </nav>

        <!-- VISTA 1: MANDO D-PAD VIRTUAL -->
        <main class="tab-content active" id="pad-view">
            <!-- BARRA SUPERIOR DE ACCIONES RÁPIDAS -->
            <div class="top-actions-grid">
                <button class="action-btn btn-power" id="btn-power" title="Apagar / Suspender">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42A7.92 7.92 0 0 1 20 12a8 8 0 1 1-11.41-5.41L7.17 5.17A9.96 9.96 0 0 0 2 12a10 10 0 1 0 15.83-6.83z"/></svg>
                </button>
                <button class="action-btn" id="btn-mute" title="Silenciar">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                </button>
                <button class="action-btn" id="btn-keyboard-search" title="Buscar en TV">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                </button>
                <button class="action-btn" id="btn-fullscreen" title="Pantalla completa">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                </button>
            </div>

            <!-- TECLADO DE BÚSQUEDA RÁPIDA (COLLAPSIBLE) -->
            <div class="search-input-box hidden" id="search-input-box">
                <input type="text" id="phone-search-input" placeholder="Escribe para buscar en la TV..." autocomplete="off">
                <button id="btn-send-search">Enviar</button>
            </div>

            <!-- D-PAD VIRTUAL ERGONÓMICO -->
            <div class="dpad-container">
                <div class="dpad-cross">
                    <button class="dpad-btn up" id="dpad-up" aria-label="Arriba">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z"/></svg>
                    </button>
                    <button class="dpad-btn left" id="dpad-left" aria-label="Izquierda">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z"/></svg>
                    </button>
                    <button class="dpad-btn center-ok" id="dpad-ok" aria-label="OK / Seleccionar">
                        <span>OK</span>
                    </button>
                    <button class="dpad-btn right" id="dpad-right" aria-label="Derecha">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
                    </button>
                    <button class="dpad-btn down" id="dpad-down" aria-label="Abajo">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
                    </button>
                </div>
            </div>

            <!-- CONTROLES VERTICALES VOLUMEN / CANAL -->
            <div class="rockers-container">
                <!-- COLUMNA VOLUMEN -->
                <div class="rocker-card">
                    <span class="rocker-label">VOL</span>
                    <button class="rocker-btn" id="btn-vol-up">＋</button>
                    <button class="rocker-btn" id="btn-vol-down">－</button>
                </div>

                <!-- BOTONES DE MEDIO (BACK & HOME) -->
                <div class="center-controls">
                    <button class="sub-action-btn" id="btn-back" title="Atrás">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                        <span>Atrás</span>
                    </button>
                    <button class="sub-action-btn" id="btn-play-pause" title="Pausar / Reanudar">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                        <span>Pausa</span>
                    </button>
                    <button class="sub-action-btn" id="btn-guide" title="Guía de canales">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
                        <span>Lista</span>
                    </button>
                </div>

                <!-- COLUMNA CANALES CH -->
                <div class="rocker-card">
                    <span class="rocker-label">CH</span>
                    <button class="rocker-btn" id="btn-ch-up">▲</button>
                    <button class="rocker-btn" id="btn-ch-down">▼</button>
                </div>
            </div>
        </main>

        <!-- VISTA 2: GUÍA DE CANALES DIRECTA -->
        <section class="tab-content" id="channels-view">
            <div class="channel-search-bar">
                <input type="text" id="remote-ch-search" placeholder="Buscar entre 193 canales...">
            </div>
            
            <div class="channel-category-chips" id="ch-chips">
                <button class="chip active" data-cat="all">Todos</button>
                <button class="chip" data-cat="Nacionales">Nacionales</button>
                <button class="chip" data-cat="Deportes">Deportes</button>
                <button class="chip" data-cat="Noticias">Noticias</button>
                <button class="chip" data-cat="Entretenimiento">Entretenimiento</button>
                <button class="chip" data-cat="Internacionales">Internacionales</button>
            </div>

            <div class="remote-channel-list" id="remote-channel-list">
                <!-- Se llena dinámicamente con channels.json -->
                <div class="loading-state">Cargando canales...</div>
            </div>
        </section>

        <!-- VISTA 3: TECLADO NUMÉRICO -->
        <section class="tab-content" id="numpad-view">
            <div class="numpad-display">
                <span class="numpad-val" id="numpad-val">--</span>
            </div>
            <div class="numpad-grid">
                <button class="num-btn" data-num="1">1</button>
                <button class="num-btn" data-num="2">2</button>
                <button class="num-btn" data-num="3">3</button>
                <button class="num-btn" data-num="4">4</button>
                <button class="num-btn" data-num="5">5</button>
                <button class="num-btn" data-num="6">6</button>
                <button class="num-btn" data-num="7">7</button>
                <button class="num-btn" data-num="8">8</button>
                <button class="num-btn" data-num="9">9</button>
                <button class="num-btn clear-btn" id="numpad-clear">C</button>
                <button class="num-btn" data-num="0">0</button>
                <button class="num-btn enter-btn" id="numpad-enter">IR</button>
            </div>
        </section>
    </div>

    <script src="remote.js?v=20261028.1915"></script>
</body>
</html>
