name: Build and Release OTA

on:
  push:
    tags:
      - 'v*' # Se ejecuta automáticamente cuando subes una etiqueta que inicia con "v" (ej: v1.1, v1.2)

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease # Compila el APK en modo release signed con debug keys

      - name: Extract Version Info from build.gradle
        id: get_version
        run: |
          # Extrae automáticamente el versionCode y versionName de app/build.gradle
          VERSION_CODE=$(grep -oE "versionCode [0-9]+" app/build.gradle | awk '{print $2}')
          VERSION_NAME=$(grep -oE "versionName \"[^\"]+\"" app/build.gradle | tr -d '"' | awk '{print $2}')
          TAG_NAME=${GITHUB_REF#refs/tags/}
          
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: "Versión ${{ env.VERSION_NAME }}"
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update update.json
        run: |
          # Genera dinámicamente el archivo update.json apuntando al nuevo APK en las Releases de tu repositorio
          cat <<EOF > update.json
          {
            "versionCode": ${{ env.VERSION_CODE }},
            "versionName": "${{ env.VERSION_NAME }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/app-release.apk",
            "releaseNotes": "Actualización automática construida mediante GitHub Actions para la versión v${{ env.VERSION_NAME }}."
          }
          EOF

      - name: Commit and Push update.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: auto-update update.json to v${{ env.VERSION_NAME }} [skip ci]" || exit 0
          git push origin HEAD:main # Sube el update.json actualizado a tu rama principal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
